<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Room</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap');
  :root {
    --bg:#0d0a0e;--surface:#161018;--surface2:#1e1624;--border:#2a1f30;
    --accent:#c084fc;--accent2:#f472b6;--text:#f0e8f5;--muted:#7c6a8a;
    --rj:#a78bfa;--dee:#f472b6;
    --ai1:#34d399;--ai2:#60a5fa;--ai3:#fb923c;--ai4:#f87171;
    --ai5:#facc15;--ai6:#e879f9;--ai7:#38bdf8;--ai8:#4ade80;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;}

  /* SCREENS */
  .screen{display:none;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:20px 16px;overflow-y:auto;
    background:radial-gradient(ellipse at 65% 10%,#2d1060 0%,transparent 55%),radial-gradient(ellipse at 15% 90%,#6b1a4a 0%,transparent 45%),var(--bg);}
  .screen.active{display:flex;}
  #chat-screen{display:none;flex-direction:column;height:100vh;}
  #chat-screen.active{display:flex;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:30px 26px;width:100%;max-width:500px;box-shadow:0 0 60px rgba(192,132,252,.08);margin:auto;}
  .title{font-family:'Playfair Display',serif;font-size:1.9rem;font-style:italic;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:4px;}
  .sub{color:var(--muted);font-size:.72rem;text-align:center;margin-bottom:24px;letter-spacing:.06em;text-transform:uppercase;}
  .field{margin-bottom:13px;}
  label{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;}
  input[type=text],input[type=password],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.87rem;padding:9px 13px;outline:none;transition:border-color .2s;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  select option{background:#1e1624;}
  .btn{width:100%;padding:13px;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:.95rem;font-weight:500;cursor:pointer;transition:opacity .2s,transform .1s;}
  .btn:hover{opacity:.88;transform:translateY(-1px);}
  .btn-primary{background:linear-gradient(135deg,#7c3aed,#be185d);color:white;}
  .btn-secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text);margin-top:9px;}
  .btn-ghost{width:100%;padding:11px;background:transparent;border:1px dashed var(--border);border-radius:12px;color:var(--accent);font-family:'DM Sans',sans-serif;font-size:.87rem;cursor:pointer;transition:all .15s;margin-bottom:13px;}
  .btn-ghost:hover{border-color:var(--accent);background:rgba(192,132,252,.05);}
  .error-login{color:#f87171;font-size:.78rem;text-align:center;margin-top:8px;min-height:18px;}

  /* CHAR CARDS */
  #characters-container{display:flex;flex-direction:column;gap:11px;margin-bottom:11px;}
  .char-card{background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:13px;display:flex;flex-direction:column;gap:9px;animation:slideIn .2s ease;}
  @keyframes slideIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
  .char-top{display:flex;align-items:center;justify-content:space-between;}
  .char-top-left{display:flex;align-items:center;gap:7px;}
  .char-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .char-num{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .btn-remove{background:transparent;border:1px solid #3d1c1c;color:#f87171;font-size:.68rem;padding:3px 9px;border-radius:20px;cursor:pointer;transition:all .15s;}
  .btn-remove:hover{background:#3d1c1c;}
  .char-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .char-desc{resize:none;height:50px;font-size:.8rem;}

  /* CHAT */
  .chat-header{padding:11px 15px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:8px;}
  .room-title{font-family:'Playfair Display',serif;font-style:italic;font-size:1rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;}
  .participants{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:center;}
  .pbadge{font-size:.65rem;padding:2px 7px;border-radius:20px;border:1px solid;opacity:.7;}
  .header-right{display:flex;align-items:center;gap:6px;}
  .conn-dot{width:7px;height:7px;border-radius:50%;background:#34d399;flex-shrink:0;}
  .who-badge{font-size:.7rem;padding:3px 10px;border-radius:20px;border:1px solid;}
  .btn-leave{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:.7rem;padding:4px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:all .15s;}
  .btn-leave:hover{border-color:#f87171;color:#f87171;}

  .messages{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px;}
  .messages::-webkit-scrollbar{width:3px;}
  .messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  .msg{display:flex;gap:9px;animation:msgIn .2s ease;max-width:80%;}
  @keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .msg.from-rj{align-self:flex-end;flex-direction:row-reverse;}
  .msg.from-dee{align-self:flex-end;flex-direction:row-reverse;}
  .msg.from-ai{align-self:flex-start;}
  .msg-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;flex-shrink:0;border:2px solid;}
  .msg-body{display:flex;flex-direction:column;gap:3px;}
  .msg-sender{font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;opacity:.55;}
  .msg.from-rj .msg-sender,.msg.from-dee .msg-sender{text-align:right;}
  .msg-bubble{padding:8px 12px;border-radius:13px;font-size:.86rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
  .msg.from-rj .msg-bubble{background:#2d1f5e;border:1px solid #4c35a0;border-bottom-right-radius:3px;}
  .msg.from-dee .msg-bubble{background:#4a1030;border:1px solid #9d174d;border-bottom-right-radius:3px;}
  .msg.from-ai .msg-bubble{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:3px;}
  .tag-highlight{color:var(--accent);font-weight:500;}

  .typing-indicator{display:flex;gap:3px;align-items:center;padding:9px 12px;}
  .typing-dot{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:tb 1.2s ease infinite;}
  .typing-dot:nth-child(2){animation-delay:.2s;}.typing-dot:nth-child(3){animation-delay:.4s;}
  @keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

  .input-area{padding:11px 13px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;}
  .input-row{display:flex;gap:7px;align-items:flex-end;}
  #msg-input{flex:1;resize:none;height:42px;min-height:42px;max-height:100px;border-radius:11px;padding:9px 13px;font-size:.87rem;line-height:1.4;overflow-y:auto;}
  .send-btn{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#7c3aed,#be185d);border:none;color:white;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s,transform .1s;flex-shrink:0;}
  .send-btn:hover{opacity:.83;transform:scale(1.05);}
  .send-btn:disabled{opacity:.3;cursor:not-allowed;transform:none;}

  /* RJ-only AI controls */
  .ai-row{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;align-items:center;}
  .ai-btn{padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;font-size:.68rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;color:var(--muted);}
  .ai-btn:hover{border-color:var(--accent);color:var(--accent);}
  .ai-btn:disabled{opacity:.3;cursor:not-allowed;}
  .shreya-hint{font-size:.68rem;color:var(--muted);margin-top:7px;font-style:italic;}

  .divider-msg{text-align:center;font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;padding:2px 0;}
  .error-msg{background:#3b1c1c;border:1px solid #7f1d1d;border-radius:9px;padding:7px 11px;font-size:.78rem;color:#fca5a5;}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="screen active" id="screen-login">
  <div class="card">
    <div class="title">Private Room</div>
    <div class="sub">Sign in to enter</div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="login-username" placeholder="rohan or shreya" autocomplete="off">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="error-login" id="login-error"></div>
    <button class="btn btn-primary" style="margin-top:4px;" onclick="doLogin()">Enter →</button>
  </div>
</div>

<!-- ROHAN SETUP SCREEN -->
<div class="screen" id="screen-setup">
  <div class="card" style="max-width:560px;">
    <div class="title">Room Setup</div>
    <div class="sub">Configure characters · RJ only</div>
    <div class="field">
      <label>Venice API Key</label>
      <input type="password" id="setup-api-key" placeholder="vapi_..." autocomplete="off">
    </div>
    <div class="field">
      <label>Model</label>
      <select id="setup-model">
        <option value="llama-3.3-70b">Llama 3.3 70B — Private · Fast</option>
        <option value="mistral-31-24b">Mistral 31 24B — Private</option>
        <option value="llama-3.1-405b">Llama 3.1 405B — Private · Smartest</option>
        <option value="deepseek-r1-671b">DeepSeek R1 671B — Private</option>
      </select>
    </div>
    <div class="field"><label>AI Characters</label></div>
    <div id="characters-container"></div>
    <button class="btn-ghost" onclick="addCharacter()">＋ Add Character</button>
    <button class="btn btn-primary" onclick="saveAndEnter()">Save &amp; Enter Room →</button>
  </div>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen">
  <div class="chat-header">
    <div class="room-title">Private Room</div>
    <div class="participants" id="participants-display"></div>
    <div class="header-right">
      <div class="conn-dot"></div>
      <div class="who-badge" id="who-badge"></div>
      <button class="btn-leave" onclick="leaveRoom()">Leave</button>
    </div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <div class="input-row">
      <textarea id="msg-input" placeholder="Type a message… (Shreya: use @Name to tag a character)" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">↑</button>
    </div>
    <div class="ai-row" id="ai-row"></div>
    <div class="shreya-hint" id="shreya-hint" style="display:none;">Tip: Tag a character with @Name to get their reply automatically</div>
  </div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, push, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAWp6ga6Oe3t3NPpmeSfwsDrc6gTGNjveQ",
  authDomain: "fir-room-d01a8.firebaseapp.com",
  databaseURL: "https://fir-room-d01a8-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "fir-room-d01a8",
  storageBucket: "fir-room-d01a8.firebasestorage.app",
  messagingSenderId: "427004690721",
  appId: "1:427004690721:web:62c2eaa01ae3c1cd3b7e60"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
window._db = db;
window._dbRef = ref;
window._dbSet = set;
window._dbPush = push;
window._dbOnValue = onValue;
window._dbGet = get;
</script>

<script>
// ── CREDENTIALS ──
const USERS = {
  'rohan':  { password: 'rohan1403',  display: 'RJ',  color: '--rj',  role: 'rj' },
  'shreya': { password: 'shreya5212', display: 'Dee', color: '--dee', role: 'dee' },
};

const AI_COLORS = ['--ai1','--ai2','--ai3','--ai4','--ai5','--ai6','--ai7','--ai8'];
const ARCHETYPES = [
  {label:'Mysterious Stranger', desc:'Enigmatic, seductive, speaks in riddles and dark poetry'},
  {label:'Bold Lover',          desc:'Confident, passionate, direct and unapologetically flirtatious'},
  {label:'Playful Tease',       desc:'Witty, teasing, loves wordplay and keeping things light but spicy'},
  {label:'Dominant',            desc:'Commanding, assertive, takes charge naturally'},
  {label:'Submissive',          desc:'Eager to please, gentle, responds warmly to desires'},
  {label:'Romantic',            desc:'Poetic, deeply emotional, expresses feelings beautifully'},
  {label:'Wild & Free',         desc:'Spontaneous, adventurous, breaks all conventions'},
  {label:'Sophisticated',       desc:'Cultured, refined, sensuous in an elevated way'},
  {label:'Custom…',             desc:''},
];
const GENDERS = ['Male','Female','Non-binary'];

let currentUser = null;
let characters = [];
let apiKey = '';
let selectedModel = 'llama-3.3-70b';
let isLoading = false;
let msgUnsubscribe = null;
let knownMsgKeys = new Set();
let cardCounter = 0;
const ROOM = 'main'; // single room

// ── LOGIN ──
function doLogin() {
  const uname = document.getElementById('login-username').value.trim().toLowerCase();
  const pass  = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  const user  = USERS[uname];
  if (!user || user.password !== pass) {
    errEl.textContent = 'Invalid username or password.';
    return;
  }
  errEl.textContent = '';
  currentUser = user;

  if (user.role === 'rj') {
    loadSetupFromFirebase().then(() => {
      showScreen('screen-setup');
    });
  } else {
    // Dee: load config then go straight to chat
    loadConfigAndEnterChat();
  }
}
window.doLogin = doLogin;

// ── SETUP (Rohan only) ──
async function loadSetupFromFirebase() {
  // Load API key from localStorage first
  const savedKey = localStorage.getItem('venice_api_key');
  if (savedKey) document.getElementById('setup-api-key').value = savedKey;

  const snap = await window._dbGet(window._dbRef(window._db, `${ROOM}/meta`));
  if (!snap.exists()) { addCharacter(); return; }
  const meta = snap.val();
  if (meta.model) document.getElementById('setup-model').value = meta.model;
  if (meta.characters && meta.characters.length) {
    meta.characters.forEach(c => addCharacterPrefilled(c));
  } else {
    addCharacter();
  }
}

async function saveAndEnter() {
  apiKey = document.getElementById('setup-api-key').value.trim();
  if (!apiKey) { alert('Enter your Venice API key.'); return; }
  const cards = document.querySelectorAll('.char-card');
  if (!cards.length) { alert('Add at least one character.'); return; }

  // Save key to localStorage only (never Firebase)
  localStorage.setItem('venice_api_key', apiKey);

  selectedModel = document.getElementById('setup-model').value;
  characters = Array.from(cards).map((card, i) => ({
    name: card.querySelector('.char-name-input').value.trim() || `Character ${i+1}`,
    gender: card.querySelector('.char-gender').value,
    archetype: ARCHETYPES[parseInt(card.querySelector('.char-archetype').value)].label,
    desc: card.querySelector('.char-desc').value.trim(),
    coupleWith: card.querySelector('.char-couple').value || null,
    color: AI_COLORS[i % AI_COLORS.length],
  }));
  // Save config to Firebase WITHOUT the API key
  await window._dbSet(window._dbRef(window._db, `${ROOM}/meta`), {
    characters, model: selectedModel, updatedAt: Date.now()
  });
  enterChat();
}
window.saveAndEnter = saveAndEnter;

async function loadConfigAndEnterChat() {
  const snap = await window._dbGet(window._dbRef(window._db, `${ROOM}/meta`));
  if (!snap.exists()) {
    alert('Room not set up yet. Ask RJ to log in and configure the room first.');
    showScreen('screen-login');
    return;
  }
  const meta = snap.val();
  characters = meta.characters || [];
  selectedModel = meta.model || 'llama-3.3-70b';
  apiKey = ''; // Dee never has the key
  enterChat();
}

// ── CHAR CARDS ──
function addCharacter() {
  addCharacterPrefilled({});
}

function addCharacterPrefilled(preset) {
  const container = document.getElementById('characters-container');
  const idx = container.querySelectorAll('.char-card').length;
  if (idx >= 8) { alert('Maximum 8 characters.'); return; }
  const colorVar = AI_COLORS[idx % AI_COLORS.length];
  const id = ++cardCounter;
  const archIdx = ARCHETYPES.findIndex(a => a.label === preset.archetype) ?? 0;
  const safeArchIdx = archIdx < 0 ? 0 : archIdx;

  const card = document.createElement('div');
  card.className = 'char-card'; card.dataset.id = id;
  card.innerHTML = `
    <div class="char-top">
      <div class="char-top-left">
        <div class="char-dot" style="background:var(${colorVar})"></div>
        <span class="char-num">Character ${idx+1}</span>
      </div>
      <button class="btn-remove" onclick="removeCharacter(${id})">✕ Remove</button>
    </div>
    <div class="char-grid">
      <div>
        <label>Name</label>
        <input type="text" class="char-name-input" placeholder="e.g. Aria, Dev, Luna…" value="${escHtml(preset.name||'')}">
      </div>
      <div>
        <label>Gender</label>
        <select class="char-gender">
          ${GENDERS.map(g=>`<option value="${g}" ${preset.gender===g?'selected':''}>${g}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="char-grid">
      <div>
        <label>Personality</label>
        <select class="char-archetype" onchange="onArchetypeChange(this,${id})">
          ${ARCHETYPES.map((a,j)=>`<option value="${j}" ${j===safeArchIdx?'selected':''}>${a.label}</option>`).join('')}
        </select>
      </div>
      <div>
        <label>Couple with</label>
        <select class="char-couple">
          <option value="">— None —</option>
        </select>
      </div>
    </div>
    <div>
      <label>Description</label>
      <textarea class="char-desc" placeholder="How they speak, what makes them real…">${escHtml(preset.desc !== undefined ? preset.desc : ARCHETYPES[0].desc)}</textarea>
    </div>`;
  container.appendChild(card);
  if (!preset.name) card.querySelector('.char-name-input').focus();
  renumberCards();
}

function removeCharacter(id) {
  const card = document.querySelector(`.char-card[data-id="${id}"]`);
  if (card) card.remove();
  renumberCards();
}

function renumberCards() {
  const cards = document.querySelectorAll('.char-card');
  const names = Array.from(cards).map(card => card.querySelector('.char-name-input').value.trim() || '');
  cards.forEach((card,i) => {
    card.querySelector('.char-num').textContent = `Character ${i+1}`;
    card.querySelector('.char-dot').style.background = `var(${AI_COLORS[i%AI_COLORS.length]})`;
    // Refresh couple dropdown
    const coupleEl = card.querySelector('.char-couple');
    const currentVal = coupleEl.value;
    coupleEl.innerHTML = '<option value="">— None —</option>';
    names.forEach((n,j) => {
      if (j !== i && n) coupleEl.innerHTML += `<option value="${n}" ${currentVal===n?'selected':''}>${n}</option>`;
    });
  });
  // Also refresh on name input change
  cards.forEach(card => {
    card.querySelector('.char-name-input').oninput = () => renumberCards();
  });
}

function onArchetypeChange(sel, id) {
  const card = document.querySelector(`.char-card[data-id="${id}"]`);
  const archIdx = parseInt(sel.value);
  const descArea = card.querySelector('.char-desc');
  descArea.value = archIdx < ARCHETYPES.length-1 ? ARCHETYPES[archIdx].desc : '';
  if (archIdx === ARCHETYPES.length-1) descArea.focus();
}

window.addCharacter = addCharacter;
window.removeCharacter = removeCharacter;
window.onArchetypeChange = onArchetypeChange;

// ── ENTER CHAT ──
function enterChat() {
  // RJ: always load key from localStorage
  if (currentUser.role === 'rj') {
    apiKey = localStorage.getItem('venice_api_key') || apiKey;
  }

  document.getElementById('messages').innerHTML = '';
  knownMsgKeys = new Set();
  renderParticipants();
  renderAIControls();
  subscribeMessages();

  // Who badge
  const badge = document.getElementById('who-badge');
  badge.textContent = currentUser.display;
  badge.style.borderColor = `var(${currentUser.color})`;
  badge.style.color = `var(${currentUser.color})`;

  showChat();
  addDivider('Room open · Messages sync in real time');
}

function renderParticipants() {
  const el = document.getElementById('participants-display');
  el.innerHTML = '';
  [
    {name:'RJ',  color:'var(--rj)'},
    {name:'Dee', color:'var(--dee)'},
    ...characters.map(c=>({name:c.name, color:`var(${c.color})`}))
  ].forEach(p => {
    const b = document.createElement('span');
    b.className='pbadge'; b.style.borderColor=p.color; b.style.color=p.color; b.textContent=p.name;
    el.appendChild(b);
  });
}

function renderAIControls() {
  const row = document.getElementById('ai-row');
  const hint = document.getElementById('shreya-hint');
  row.innerHTML = '';

  if (currentUser.role === 'rj') {
    hint.style.display = 'none';
    row.innerHTML = '<span style="font-size:.66rem;color:var(--muted);align-self:center;white-space:nowrap;">Ask to reply:</span>';
    characters.forEach((c,i) => {
      const btn = document.createElement('button');
      btn.className='ai-btn';
      btn.style.borderColor=`var(${c.color})`; btn.style.color=`var(${c.color})`;
      btn.textContent=c.name; btn.dataset.idx=i;
      btn.onclick = () => triggerAIResponse(i);
      row.appendChild(btn);
    });
    if (characters.length > 1) {
      const all = document.createElement('button');
      all.className='ai-btn'; all.style.borderColor='var(--accent)'; all.style.color='var(--accent)';
      all.textContent='Everyone'; all.onclick=triggerAllRespond;
      row.appendChild(all);
    }
  } else {
    // Dee: no buttons, just the hint about @tagging
    row.style.display = 'none';
    hint.style.display = 'block';
    document.getElementById('msg-input').placeholder = 'Type a message… use @Name to get a character to reply';
  }
}

// ── MESSAGES ──
function subscribeMessages() {
  if (msgUnsubscribe) msgUnsubscribe();
  const msgsRef = window._dbRef(window._db, `${ROOM}/messages`);
  msgUnsubscribe = window._dbOnValue(msgsRef, snap => {
    if (!snap.exists()) return;
    const data = snap.val();
    Object.entries(data).sort((a,b)=>a[1].ts-b[1].ts).forEach(([key,msg]) => {
      if (!knownMsgKeys.has(key)) { knownMsgKeys.add(key); renderMessage(msg); }
    });
  });
}

function renderMessage(msg) {
  const isRJ  = msg.sender === 'RJ';
  const isDee = msg.sender === 'Dee';
  let cls = 'from-ai';
  if (isRJ)  cls = 'from-rj';
  else if (isDee) cls = 'from-dee';

  const colorVar = msg.colorVar || (isRJ ? '--rj' : isDee ? '--dee' : '--ai1');
  const color = `var(${colorVar})`;
  const initials = msg.sender.slice(0,2).toUpperCase();

  // Strip leading [Name]: prefix the AI sometimes adds
  const cleanText = msg.text.replace(/^\[([^\]]+)\]:\s*/,'');

  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${cls}`;

  const bubbleHtml = escHtml(cleanText).replace(/@(\w+)/g, '<span class="tag-highlight">@$1</span>');

  div.innerHTML = `
    <div class="msg-avatar" style="border-color:${color};color:${color}">${initials}</div>
    <div class="msg-body">
      <div class="msg-sender" style="color:${color}">${escHtml(msg.sender)}</div>
      <div class="msg-bubble">${bubbleHtml}</div>
    </div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

async function pushMessage(sender, text, colorVar) {
  await window._dbPush(window._dbRef(window._db, `${ROOM}/messages`), {
    sender, text, colorVar: colorVar || null, ts: Date.now()
  });
}

let lastResponderIdx = null; // track who last responded

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || isLoading) return;

  const sender = currentUser.display;
  const colorVar = currentUser.color;
  await pushMessage(sender, text, colorVar);
  input.value = ''; input.style.height = '42px';

  // Only RJ's device triggers AI responses
  if (currentUser.role !== 'rj') return;

  // Wait a natural beat before responding
  await new Promise(r => setTimeout(r, 1500));

  // Check for @mentions first
  const mentions = detectMentions(text);
  if (mentions.length > 0) {
    for (const charIdx of mentions) {
      await getAIResponse(charIdx);
      lastResponderIdx = charIdx;
      // If this character has a couple partner, 30% chance partner chimes in too
      const partner = getPartnerIdx(charIdx);
      if (partner !== null && Math.random() < 0.3) {
        await new Promise(r => setTimeout(r, 1000));
        await getAIResponse(partner);
        lastResponderIdx = partner;
      }
    }
    return;
  }

  // No mention — pick one character smartly
  const charIdx = pickResponder();
  await getAIResponse(charIdx);
  lastResponderIdx = charIdx;

  // Couple partner occasionally joins (25% chance)
  const partner = getPartnerIdx(charIdx);
  if (partner !== null && Math.random() < 0.25) {
    await new Promise(r => setTimeout(r, 1200));
    await getAIResponse(partner);
    lastResponderIdx = partner;
  }
}

function pickResponder() {
  if (characters.length === 1) return 0;
  // Avoid same character responding twice in a row
  const eligible = characters.map((_,i) => i).filter(i => i !== lastResponderIdx);
  return eligible[Math.floor(Math.random() * eligible.length)];
}

function getPartnerIdx(charIdx) {
  const char = characters[charIdx];
  if (!char.coupleWith) return null;
  const idx = characters.findIndex(c => c.name === char.coupleWith);
  return idx !== -1 ? idx : null;
}

function detectMentions(text) {
  const mentioned = [];
  const tagRegex = /@(\w+)/gi;
  let match;
  while ((match = tagRegex.exec(text)) !== null) {
    const tagName = match[1].toLowerCase();
    const idx = characters.findIndex(c => c.name.toLowerCase() === tagName);
    if (idx !== -1 && !mentioned.includes(idx)) mentioned.push(idx);
  }
  return mentioned;
}

function handleKey(e) { if (e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} }
function autoResize(el){ el.style.height='42px'; el.style.height=Math.min(el.scrollHeight,100)+'px'; }
window.sendMessage=sendMessage; window.handleKey=handleKey; window.autoResize=autoResize;

// ── AI TRIGGERS (Rohan only buttons) ──
async function triggerAIResponse(charIdx) {
  if (isLoading) return;
  await getAIResponse(charIdx);
}

async function triggerAllRespond() {
  if (isLoading) return;
  for (let i=0; i<characters.length; i++) {
    await getAIResponse(i);
    if (i<characters.length-1) await new Promise(r=>setTimeout(r,350));
  }
}
window.triggerAIResponse=triggerAIResponse; window.triggerAllRespond=triggerAllRespond;

async function getAIResponse(charIdx) {
  if (!apiKey) { addLocalError('No Venice API key available.'); return; }
  const char = characters[charIdx];
  isLoading = true; setAIButtonsDisabled(true);
  const typingEl = addLocalTyping(char);

  // Pull last 30 messages for context
  const snap = await window._dbGet(window._dbRef(window._db, `${ROOM}/messages`));
  let historyLines = [];
  if (snap.exists()) {
    historyLines = Object.values(snap.val()).sort((a,b)=>a.ts-b.ts).slice(-30).map(m=>`[${m.sender}]: ${m.text}`);
  }

  const couplePartner = char.coupleWith ? characters.find(c => c.name === char.coupleWith) : null;
  const othersDesc = characters.filter((_,i)=>i!==charIdx).map(c=>{
    const rel = c.name === char.coupleWith ? ` — your partner` : char.name === c.coupleWith ? ` — your partner` : '';
    return `- ${c.name} (${c.gender})${rel}: ${c.desc||c.archetype}`;
  }).join('\n');

  const coupleContext = couplePartner
    ? `You and ${couplePartner.name} are a couple — you have your own dynamic, chemistry, inside jokes, and tension. You respond to ${couplePartner.name} differently than to others.`
    : '';

  const systemPrompt = `You are ${char.name}. ${char.desc || char.archetype}.
${coupleContext}
You're in a private chat with RJ, Dee${characters.length > 1 ? ', and others' : ''}.
${othersDesc ? `Others here:\n${othersDesc}` : ''}

Write exactly like a real person texting — casual, spontaneous, sometimes incomplete thoughts. No bullet points, no formal language. React naturally to what was just said. You can be playful, flirty, direct, or emotional depending on the mood. Don't narrate your actions. Don't announce who you are. Just respond.`;

  const apiMessages = [{
    role:'user',
    content:`${systemPrompt}\n\n--- Chat so far ---\n${historyLines.join('\n')||'(just started)'}\n\nReply as ${char.name} now. Just the message, no name prefix.`
  }];

  try {
    const res = await fetch('https://api.venice.ai/api/v1/chat/completions',{
      method:'POST',
      headers:{'Authorization':`Bearer ${apiKey}`,'Content-Type':'application/json'},
      body: JSON.stringify({model:selectedModel,messages:apiMessages,max_tokens:350,temperature:0.92,venice_parameters:{include_venice_system_prompt:false}})
    });
    typingEl.remove();
    if (!res.ok) {
      const err = await res.json().catch(()=>({}));
      addLocalError(`API error (${res.status}): ${err.error?.message||res.statusText}`);
    } else {
      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content?.trim()||'…';
      await pushMessage(char.name, reply, char.color);
    }
  } catch(e) { typingEl.remove(); addLocalError(`Network error: ${e.message}`); }

  isLoading=false; setAIButtonsDisabled(false);
}

function setAIButtonsDisabled(d) {
  document.querySelectorAll('.ai-btn').forEach(b=>b.disabled=d);
  document.getElementById('send-btn').disabled=d;
}

function addLocalTyping(char) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div'); div.className='msg from-ai';
  const color=`var(${char.color})`;
  div.innerHTML=`<div class="msg-avatar" style="border-color:${color};color:${color}">${char.name.slice(0,2).toUpperCase()}</div><div class="msg-body"><div class="msg-sender" style="color:${color}">${escHtml(char.name)}</div><div class="msg-bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div></div>`;
  msgs.appendChild(div); msgs.scrollTop=msgs.scrollHeight; return div;
}

function addDivider(text) {
  const msgs=document.getElementById('messages');
  const d=document.createElement('div'); d.className='divider-msg'; d.textContent=text; msgs.appendChild(d);
}

function addLocalError(msg) {
  const msgs=document.getElementById('messages');
  const d=document.createElement('div'); d.className='error-msg'; d.textContent=msg;
  msgs.appendChild(d); msgs.scrollTop=msgs.scrollHeight;
}

function leaveRoom() {
  if (!confirm('Leave the room?')) return;
  if (msgUnsubscribe) { msgUnsubscribe(); msgUnsubscribe=null; }
  currentUser=null; characters=[]; apiKey='';
  document.getElementById('login-username').value='';
  document.getElementById('login-password').value='';
  document.getElementById('characters-container').innerHTML='';
  cardCounter=0;
  showScreen('screen-login');
}
window.leaveRoom=leaveRoom;

// ── HELPERS ──
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById(id);
  if(el) el.classList.add('active');
  document.getElementById('chat-screen').classList.remove('active');
  document.getElementById('chat-screen').style.display='none';
}

function showChat() {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('chat-screen').style.display='flex';
  document.getElementById('chat-screen').classList.add('active');
}

function escHtml(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
</script>

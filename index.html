<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Room</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap');
:root {
  --bg:#0d0a0e;--surface:#161018;--surface2:#1e1624;--border:#2a1f30;
  --accent:#c084fc;--accent2:#f472b6;--text:#f0e8f5;--muted:#7c6a8a;
  --rj:#a78bfa;--dee:#f472b6;
  --ai1:#34d399;--ai2:#60a5fa;--ai3:#fb923c;--ai4:#f87171;
  --ai5:#facc15;--ai6:#e879f9;--ai7:#38bdf8;--ai8:#4ade80;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;}

.screen{display:none;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;padding:24px 16px;overflow-y:auto;
  background:radial-gradient(ellipse at 65% 5%,#2d1060 0%,transparent 50%),radial-gradient(ellipse at 10% 95%,#6b1a4a 0%,transparent 45%),var(--bg);}
.screen.active{display:flex;}
#chat-screen{display:none;flex-direction:column;height:100vh;}
#chat-screen.active{display:flex;}

/* CARDS & TYPOGRAPHY */
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:28px 24px;width:100%;max-width:500px;box-shadow:0 0 60px rgba(192,132,252,.07);margin:auto;}
.wide-card{max-width:640px;}
.title{font-family:'Playfair Display',serif;font-size:1.85rem;font-style:italic;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:4px;}
.sub{color:var(--muted);font-size:.72rem;text-align:center;margin-bottom:22px;letter-spacing:.06em;text-transform:uppercase;}
.field{margin-bottom:13px;}
label{display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;}
input[type=text],input[type=password],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:.87rem;padding:9px 13px;outline:none;transition:border-color .2s;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);}
select option{background:#1e1624;}
.btn{width:100%;padding:12px;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:.93rem;font-weight:500;cursor:pointer;transition:opacity .2s,transform .1s;}
.btn:hover{opacity:.87;transform:translateY(-1px);}
.btn-primary{background:linear-gradient(135deg,#7c3aed,#be185d);color:white;}
.btn-secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text);margin-top:8px;}
.btn-danger{background:transparent;border:1px solid #7f1d1d;color:#f87171;margin-top:8px;}
.btn-ghost{width:100%;padding:10px;background:transparent;border:1px dashed var(--border);border-radius:12px;color:var(--accent);font-family:'DM Sans',sans-serif;font-size:.87rem;cursor:pointer;transition:all .15s;margin-bottom:12px;}
.btn-ghost:hover{border-color:var(--accent);background:rgba(192,132,252,.05);}
.error-login{color:#f87171;font-size:.78rem;text-align:center;margin-top:6px;min-height:18px;}

/* LOBBY */
.lobby-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;width:100%;max-width:640px;}
.lobby-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-style:italic;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.lobby-user{display:flex;align-items:center;gap:8px;}
.lobby-who{font-size:.75rem;padding:3px 10px;border-radius:20px;border:1px solid;}
.btn-logout{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:.7rem;padding:4px 9px;border-radius:8px;cursor:pointer;transition:all .15s;}
.btn-logout:hover{border-color:#f87171;color:#f87171;}

.rooms-grid{display:flex;flex-direction:column;gap:12px;width:100%;max-width:640px;}
.room-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;cursor:pointer;transition:all .2s;position:relative;animation:slideIn .2s ease;}
.room-card:hover{border-color:var(--accent);box-shadow:0 0 20px rgba(192,132,252,.1);transform:translateY(-1px);}
@keyframes slideIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.room-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
.room-name{font-family:'Playfair Display',serif;font-size:1.1rem;font-style:italic;color:var(--text);}
.room-actions{display:flex;gap:6px;flex-shrink:0;}
.btn-icon{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:.7rem;padding:3px 8px;border-radius:8px;cursor:pointer;transition:all .15s;}
.btn-icon:hover{border-color:var(--accent);color:var(--accent);}
.btn-icon.danger:hover{border-color:#f87171;color:#f87171;}
.room-vibe{font-size:.82rem;color:var(--muted);margin-bottom:10px;line-height:1.4;}
.room-cast{display:flex;gap:5px;flex-wrap:wrap;}
.cast-pill{font-size:.68rem;padding:2px 8px;border-radius:20px;border:1px solid;opacity:.75;}
.room-empty{text-align:center;color:var(--muted);font-size:.85rem;padding:32px;border:1px dashed var(--border);border-radius:16px;}

/* CHAR CARDS */
#characters-container{display:flex;flex-direction:column;gap:11px;margin-bottom:11px;}
.char-card{background:var(--surface2);border:1px solid var(--border);border-radius:13px;padding:13px;display:flex;flex-direction:column;gap:9px;}
.char-top{display:flex;align-items:center;justify-content:space-between;}
.char-top-left{display:flex;align-items:center;gap:7px;}
.char-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.char-num{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.btn-remove{background:transparent;border:1px solid #3d1c1c;color:#f87171;font-size:.68rem;padding:3px 9px;border-radius:20px;cursor:pointer;}
.char-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.char-desc{resize:none;height:50px;font-size:.8rem;}

/* CHAT */
.chat-header{padding:11px 15px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:8px;}
.chat-room-name{font-family:'Playfair Display',serif;font-style:italic;font-size:1rem;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis;}
.scenario-display{background:var(--surface2);border-bottom:1px solid var(--border);padding:12px 15px;font-size:.88rem;line-height:1.5;}
.participants{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:center;}
.pbadge{font-size:.65rem;padding:2px 7px;border-radius:20px;border:1px solid;opacity:.7;}
.header-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.conn-dot{width:7px;height:7px;border-radius:50%;background:#34d399;}
.who-badge{font-size:.7rem;padding:3px 10px;border-radius:20px;border:1px solid;}
.btn-back{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:.7rem;padding:4px 9px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:all .15s;}
.btn-back:hover{border-color:var(--accent);color:var(--accent);}

.messages{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px;}
.messages::-webkit-scrollbar{width:3px;}
.messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.msg{display:flex;gap:9px;animation:msgIn .2s ease;max-width:80%;}
@keyframes msgIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg.from-rj,.msg.from-dee{align-self:flex-end;flex-direction:row-reverse;}
.msg.from-ai{align-self:flex-start;}
.msg-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;flex-shrink:0;border:2px solid;}
.msg-body{display:flex;flex-direction:column;gap:3px;}
.msg-sender{font-size:.65rem;text-transform:uppercase;letter-spacing:.06em;opacity:.55;}
.msg.from-rj .msg-sender,.msg.from-dee .msg-sender{text-align:right;}
.msg-bubble{padding:8px 12px;border-radius:13px;font-size:.86rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.msg.from-rj .msg-bubble{background:#2d1f5e;border:1px solid #4c35a0;border-bottom-right-radius:3px;}
.msg.from-dee .msg-bubble{background:#4a1030;border:1px solid #9d174d;border-bottom-right-radius:3px;}
.msg.from-ai .msg-bubble{background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:3px;}
.tag-highlight{color:var(--accent);font-weight:500;}
.typing-indicator{display:flex;gap:3px;align-items:center;padding:9px 12px;}
.typing-dot{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:tb 1.2s ease infinite;}
.typing-dot:nth-child(2){animation-delay:.2s;}.typing-dot:nth-child(3){animation-delay:.4s;}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

.input-area{padding:11px 13px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;}
.input-row{display:flex;gap:7px;align-items:flex-end;}
#msg-input{flex:1;resize:none;height:42px;min-height:42px;max-height:100px;border-radius:11px;padding:9px 13px;font-size:.87rem;line-height:1.4;overflow-y:auto;}
.send-btn{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#7c3aed,#be185d);border:none;color:white;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:opacity .15s,transform .1s;flex-shrink:0;}
.send-btn:hover{opacity:.83;transform:scale(1.05);}
.send-btn:disabled{opacity:.3;cursor:not-allowed;transform:none;}
.ai-row{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;align-items:center;}
.ai-btn{padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:transparent;font-size:.68rem;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s;color:var(--muted);}
.ai-btn:hover{border-color:var(--accent);color:var(--accent);}
.ai-btn:disabled{opacity:.3;cursor:not-allowed;}
.dee-hint{font-size:.68rem;color:var(--muted);margin-top:7px;font-style:italic;}

.divider-msg{text-align:center;font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;padding:2px 0;}
.scene-card{text-align:center;padding:14px 20px;margin:8px 0;border-left:2px solid var(--accent);border-right:2px solid var(--accent);background:rgba(192,132,252,.05);border-radius:8px;font-style:italic;font-size:.88rem;color:var(--muted);line-height:1.6;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
.error-msg{background:#3b1c1c;border:1px solid #7f1d1d;border-radius:9px;padding:7px 11px;font-size:.78rem;color:#fca5a5;}
.info-toast{background:rgba(192,132,252,.1);border:1px solid rgba(192,132,252,.25);border-radius:9px;padding:7px 11px;font-size:.78rem;color:var(--accent);text-align:center;}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="screen active" id="screen-login">
  <div class="card">
    <div class="title">Private Room</div>
    <div class="sub">Sign in to enter</div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="login-username" placeholder="rohan or shreya" autocomplete="off">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="••••••••" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="error-login" id="login-error"></div>
    <button class="btn btn-primary" style="margin-top:6px;" onclick="doLogin()">Enter →</button>
  </div>
</div>

<!-- LOBBY -->
<div class="screen" id="screen-lobby">
  <div class="lobby-header">
    <div class="lobby-title">Your Rooms</div>
    <div class="lobby-user">
      <div class="lobby-who" id="lobby-who-badge"></div>
      <button class="btn-logout" onclick="doLogout()">Sign out</button>
    </div>
  </div>
  <div class="rooms-grid" id="rooms-grid">
    <div class="room-empty" id="rooms-empty">No rooms yet. RJ can create one below.</div>
  </div>
  <div style="width:100%;max-width:640px;margin-top:14px;" id="rj-create-btn-wrap">
    <button class="btn btn-primary" onclick="showScreen('screen-create-room')">＋ Create New Room</button>
  </div>
</div>

<!-- CREATE / EDIT ROOM -->
<div class="screen" id="screen-create-room">
  <div class="card wide-card">
    <div class="title" id="create-room-title">New Room</div>
    <div class="sub">Define the vibe and cast</div>

    <div class="field">
      <label>Room Name</label>
      <input type="text" id="room-name-input" placeholder="e.g. The Penthouse, Goa Weekend, Late Night…">
    </div>
    <div class="field">
      <label>Vibe / Setting</label>
      <textarea id="room-vibe-input" style="height:60px;resize:none;" placeholder="e.g. Luxury penthouse, late evening, candles and music. Everyone is relaxed and flirty."></textarea>
    </div>
    <div class="field">
      <label>Venice API Key</label>
      <input type="password" id="room-api-key" placeholder="vapi_..." autocomplete="off">
    </div>
    <div class="field">
      <label>Model</label>
      <select id="room-model">
        <option value="llama-3.3-70b">Llama 3.3 70B — Private · Fast</option>
        <option value="mistral-31-24b">Mistral 31 24B — Private</option>
        <option value="llama-3.1-405b">Llama 3.1 405B — Private · Smartest</option>
        <option value="deepseek-r1-671b">DeepSeek R1 671B — Private</option>
      </select>
    </div>

    <div class="field">
      <label>Room Type</label>
      <select id="room-type">
        <option value="in-person">In-Person (with scene descriptions)</option>
        <option value="online">Online (texting/video, no scenes)</option>
      </select>
    </div>

    <div class="field" style="display:flex;align-items:center;gap:8px;">
      <input type="checkbox" id="dee-access" checked style="width:16px;height:16px;cursor:pointer;">
      <label style="margin:0;cursor:pointer;">Allow Dee to enter this room</label>
    </div>

    <div class="field"><label>Characters</label></div>
    <div id="characters-container"></div>
    <button class="btn-ghost" onclick="addCharacter()">＋ Add Character</button>

    <button class="btn btn-primary" onclick="saveRoom()">Save Room →</button>
    <button class="btn btn-secondary" onclick="showLobby()">← Back</button>
  </div>
</div>

<!-- CHAT -->
<div id="chat-screen">
  <div class="chat-header">
    <div class="chat-room-name" id="chat-room-name">Room</div>
    <div class="participants" id="participants-display"></div>
    <div class="header-right">
      <div class="conn-dot"></div>
      <div class="who-badge" id="who-badge"></div>
      <button class="btn-back" id="btn-clear-history" onclick="clearRoomHistory()" style="display:none;border-color:#7f1d1d;color:#f87171;">🗑</button>
      <button class="btn-back" onclick="backToLobby()">← Rooms</button>
    </div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <div class="input-row">
      <textarea id="msg-input" placeholder="Type a message…" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()">↑</button>
    </div>
    <div id="rj-controls" style="display:none;gap:8px;margin-top:8px;">
      <button class="btn-icon" style="border-color:var(--accent);color:var(--accent);" onclick="toggleDirectorPanel()">🎬 Director</button>
      <div class="ai-row" id="ai-row"></div>
    </div>
    <div class="dee-hint" id="dee-hint" style="display:none;">Tip: use @Name to get a reply</div>
  </div>

  <!-- DIRECTOR PANEL (hidden from Dee, only RJ sees) -->
  <div id="director-panel" style="display:none;position:fixed;bottom:0;right:0;width:100%;max-width:380px;height:70vh;background:var(--surface);border-left:1px solid var(--border);border-top:1px solid var(--border);border-radius:16px 16px 0 0;padding:16px;overflow-y:auto;z-index:500;box-shadow:0 -4px 20px rgba(0,0,0,.3);" class="rj-only">>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <div style="font-size:.9rem;font-weight:500;color:var(--text);">Director Controls</div>
      <button style="background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:1rem;" onclick="toggleDirectorPanel()">✕</button>
    </div>
    
    <div style="margin-bottom:12px;">
      <label style="display:block;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;">Temperature</label>
      <div style="display:flex;align-items:center;gap:8px;">
        <input type="range" id="temp-slider" min="1" max="4" value="2" style="flex:1;cursor:pointer;" onchange="setTemperature(this.value)">
        <span id="temp-label" style="font-size:.75rem;color:var(--accent);min-width:60px;">Flirty</span>
      </div>
    </div>

    <div style="margin-bottom:12px;">
      <button class="btn btn-primary" style="width:100%;font-size:.85rem;padding:8px;" onclick="suggestSpicyScene()">✨ Suggest Spicy Moment</button>
    </div>

    <div style="border-top:1px solid var(--border);padding-top:12px;">
      <div style="font-size:.75rem;color:var(--muted);text-transform:uppercase;margin-bottom:8px;">Scene Suggestion</div>
      <div id="scene-suggestion" style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px;font-size:.85rem;color:var(--text);line-height:1.5;min-height:80px;margin-bottom:8px;font-style:italic;">No suggestion yet. Click the button above.</div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-primary" style="flex:1;padding:6px;font-size:.8rem;" onclick="acceptSceneSuggestion()">✓ Accept</button>
        <button class="btn btn-secondary" style="flex:1;padding:6px;font-size:.8rem;" onclick="suggestSpicyScene()">↻ Refresh</button>
      </div>
    </div>
  </div>
</div>

<!-- Firebase -->

<script>
const USERS = {
  'rohan':  {password:'rohan1403',  display:'RJ',  color:'--rj',  role:'rj'},
  'shreya': {password:'shreya5212', display:'Dee', color:'--dee', role:'dee'},
};
const AI_COLORS=['--ai1','--ai2','--ai3','--ai4','--ai5','--ai6','--ai7','--ai8'];
const ARCHETYPES=[
  {label:'Mysterious Stranger', desc:'Enigmatic, seductive, speaks in riddles and dark poetry'},
  {label:'Bold Lover',          desc:'Confident, passionate, direct and unapologetically flirtatious'},
  {label:'Playful Tease',       desc:'Witty, teasing, loves wordplay and keeping things light but spicy'},
  {label:'Dominant',            desc:'Commanding, assertive, takes charge naturally'},
  {label:'Submissive',          desc:'Eager to please, gentle, responds warmly to desires'},
  {label:'Romantic',            desc:'Poetic, deeply emotional, expresses feelings beautifully'},
  {label:'Wild & Free',         desc:'Spontaneous, adventurous, breaks all conventions'},
  {label:'Sophisticated',       desc:'Cultured, refined, sensuous in an elevated way'},
  {label:'Custom…',             desc:''},
];
const GENDERS=['Male','Female','Non-binary'];

let currentUser=null;
let currentRoomId=null;
let currentRoomData=null;
let currentTemperature=2; // 1=Casual, 2=Flirty, 3=Spicy, 4=Explicit
let allRooms={};
let characters=[];
let apiKey='';
let selectedModel='llama-3.3-70b';
let isLoading=false;
let msgUnsubscribe=null;
let knownMsgKeys=new Set();
let lastResponderIdx=null;
let editingRoomId=null;
let cardCounter=0;

// ── LOGIN ──
function doLogin(){
  const u=document.getElementById('login-username').value.trim().toLowerCase();
  const p=document.getElementById('login-password').value;
  const errEl=document.getElementById('login-error');
  const user=USERS[u];
  if(!user||user.password!==p){errEl.textContent='Invalid username or password.';return;}
  errEl.textContent='';
  currentUser=user;
  localStorage.setItem('session_user',u);
  if(user.role==='rj') apiKey=localStorage.getItem('venice_api_key')||'';
  showLobby();
}
window.doLogin=doLogin;

function doLogout(){
  if(msgUnsubscribe){msgUnsubscribe();msgUnsubscribe=null;}
  currentUser=null;currentRoomId=null;currentRoomData=null;
  localStorage.removeItem('session_user');
  document.getElementById('login-username').value='';
  document.getElementById('login-password').value='';
  showScreen('screen-login');
}

// ── MESSAGES ──
function subscribeMessages(roomId){
  const msgsRef=window._ref(window._db,`rooms/${roomId}/messages`);
  let initialLoad=true;
  msgUnsubscribe=window._onValue(msgsRef,snap=>{
    if(!snap.exists()){initialLoad=false;return;}
    const data=snap.val();
    const entries=Object.entries(data).sort((a,b)=>a[1].ts-b[1].ts);
    let latestNewMsg=null;
    entries.forEach(([key,msg])=>{
      if(!knownMsgKeys.has(key)){
        knownMsgKeys.add(key);
        renderMessage(msg);
        if(!initialLoad) latestNewMsg={key,msg};
      }
    });
    initialLoad=false;

    // RJ's device handles ALL AI responses — including when Dee sends
    if(latestNewMsg && currentUser.role==='rj' && apiKey){
      const sender=latestNewMsg.msg.sender;
      // Only auto-respond to human messages (RJ or Dee), not AI replies
      const isHuman=(sender==='RJ'||sender==='Dee');
      if(isHuman && !isLoading){
        const text=latestNewMsg.msg.text;
        setTimeout(async()=>{
          if(isLoading) return;
          const mentions=detectMentions(text);
          if(mentions.length>0){
            for(const idx of mentions){
              await getAIResponse(idx);lastResponderIdx=idx;
              const p=getPartnerIdx(idx);
              if(p!==null&&Math.random()<0.3){await new Promise(r=>setTimeout(r,1000));await getAIResponse(p);lastResponderIdx=p;}
            }
          } else {
            const idx=pickResponder();
            await getAIResponse(idx);lastResponderIdx=idx;
            const p=getPartnerIdx(idx);
            if(p!==null&&Math.random()<0.25){await new Promise(r=>setTimeout(r,1200));await getAIResponse(p);lastResponderIdx=p;}
          }
        },1000);
      }
    }
  });
}

function renderMessage(msg){
  const msgs=document.getElementById('messages');
  
  // Scene cards appear as italic narrative actions
  if(msg.type==='scene'){
    const card=document.createElement('div');
    card.style.cssText='text-align:center;padding:12px 20px;margin:8px 0;color:var(--muted);font-style:italic;font-size:.88rem;line-height:1.6;';
    card.textContent=`*${msg.text}*`;
    msgs.appendChild(card);
    msgs.scrollTop=msgs.scrollHeight;
    return;
  }
  
  const isRJ=msg.sender==='RJ'; const isDee=msg.sender==='Dee';
  let cls='from-ai';
  if(isRJ) cls='from-rj'; else if(isDee) cls='from-dee';
  const colorVar=msg.colorVar||(isRJ?'--rj':isDee?'--dee':'--ai1');
  const color=`var(${colorVar})`;
  const cleanText=msg.text.replace(/^\[([^\]]+)\]:\s*/,'');
  const bubbleHtml=escHtml(cleanText).replace(/@(\w+)/g,'<span class="tag-highlight">@$1</span>');
  const div=document.createElement('div');div.className=`msg ${cls}`;
  div.innerHTML=`<div class="msg-avatar" style="border-color:${color};color:${color}">${msg.sender.slice(0,2).toUpperCase()}</div><div class="msg-body"><div class="msg-sender" style="color:${color}">${escHtml(msg.sender)}</div><div class="msg-bubble">${bubbleHtml}</div></div>`;
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
}

function detectMentions(text){
  const found=[];const re=/@(\w+)/gi;let m;
  while((m=re.exec(text))!==null){
    const idx=characters.findIndex(c=>c.name.toLowerCase()===m[1].toLowerCase());
    if(idx!==-1&&!found.includes(idx)) found.push(idx);
  }
  return found;
}

function pickResponder(){
  if(characters.length===1) return 0;
  const eligible=characters.map((_,i)=>i).filter(i=>i!==lastResponderIdx);
  return eligible[Math.floor(Math.random()*eligible.length)];
}

function getPartnerIdx(charIdx){
  const char=characters[charIdx];
  if(!char.coupleWith) return null;
  const idx=characters.findIndex(c=>c.name===char.coupleWith);
  return idx!==-1?idx:null;
}

  }).join('\n');
  const couplePartner=char.coupleWith?characters.find(c=>c.name===char.coupleWith):null;
  const coupleCtx=couplePartner?`You and ${couplePartner.name} are a couple — you have your own chemistry, tension, and inside dynamic.\n`:'';

  const systemPrompt=`You are ${char.name}. ${char.desc||char.archetype}.
${vibeContext}${tempContext}${coupleCtx}${othersDesc?`Others here:\n${othersDesc}\n`:''}
People in this room:
- RJ: 38 year old male${room.deeCanAccess!==false?'\n- Dee: 33 year old female':''}

Adjust your intensity and language to match the current temperature level. Write like a real person texting — casual, spontaneous, natural. React to what was just said. Be yourself completely. No disclaimers, no name prefix, just the message.`;

  try{
    const res=await fetch('https://api.venice.ai/api/v1/chat/completions',{
      method:'POST',
      headers:{'Authorization':`Bearer ${apiKey}`,'Content-Type':'application/json'},
      body:JSON.stringify({model:selectedModel,messages:[{role:'user',content:`${systemPrompt}\n\n--- Chat ---\n${historyLines.join('\n')||'(just started)'}\n\nReply as ${char.name}. Just the message.`}],max_tokens:350,temperature:0.93,venice_parameters:{include_venice_system_prompt:false}})
    });
    typingEl.remove();
    if(!res.ok){const err=await res.json().catch(()=>({}));addLocalError(`API error (${res.status}): ${err.error?.message||res.statusText}`);}
    else{const data=await res.json();const reply=data.choices?.[0]?.message?.content?.trim()||'…';await pushMessage(char.name,reply,char.color);
      // 60% chance to auto-generate a scene description after AI response
      if(currentUser.role==='rj' && apiKey && Math.random()<0.6){
        setTimeout(()=>generateAutoScene(),1200);
      }
    }
  }catch(e){typingEl.remove();addLocalError(`Network error: ${e.message}`);}
  isLoading=false;setAIButtonsDisabled(false);
}

function setAIButtonsDisabled(d){document.querySelectorAll('.ai-btn').forEach(b=>b.disabled=d);document.getElementById('send-btn').disabled=d;}

function addLocalTyping(char){
  const msgs=document.getElementById('messages');
  const div=document.createElement('div');div.className='msg from-ai';
  const color=`var(${char.color})`;
  div.innerHTML=`<div class="msg-avatar" style="border-color:${color};color:${color}">${char.name.slice(0,2).toUpperCase()}</div><div class="msg-body"><div class="msg-sender" style="color:${color}">${escHtml(char.name)}</div><div class="msg-bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div></div>`;
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;return div;
}

function addDivider(text){const msgs=document.getElementById('messages');const d=document.createElement('div');d.className='divider-msg';d.textContent=text;msgs.appendChild(d);}
function addLocalError(msg){const msgs=document.getElementById('messages');const d=document.createElement('div');d.className='error-msg';d.textContent=msg;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;}

// ── CHAR CARDS ──
function addCharacter(){addCharacterPrefilled({});}
function addCharacterPrefilled(preset){
  const container=document.getElementById('characters-container');
  const idx=container.querySelectorAll('.char-card').length;
  if(idx>=8){alert('Maximum 8 characters.');return;}
  const colorVar=AI_COLORS[idx%AI_COLORS.length];
  const id=++cardCounter;
  const archIdx=Math.max(0,ARCHETYPES.findIndex(a=>a.label===preset.archetype));
  const card=document.createElement('div');card.className='char-card';card.dataset.id=id;
  card.innerHTML=`
    <div class="char-top">
      <div class="char-top-left"><div class="char-dot" style="background:var(${colorVar})"></div><span class="char-num">Character ${idx+1}</span></div>
      <button class="btn-remove" onclick="removeCharacter(${id})">✕ Remove</button>
    </div>
    <div class="char-grid">
      <div><label>Name</label><input type="text" class="char-name-input" placeholder="e.g. Aria, Dev…" value="${escHtml(preset.name||'')}"></div>
      <div><label>Gender</label><select class="char-gender">${GENDERS.map(g=>`<option value="${g}" ${preset.gender===g?'selected':''}>${g}</option>`).join('')}</select></div>
      <div><label>Age</label><input type="number" class="char-age" placeholder="e.g. 28" value="${preset.age||''}" min="18" max="120"></div>
    </div>
    <div class="char-grid">
      <div><label>Personality</label><select class="char-archetype" onchange="onArchetypeChange(this,${id})">${ARCHETYPES.map((a,j)=>`<option value="${j}" ${j===archIdx?'selected':''}>${a.label}</option>`).join('')}</select></div>
      <div><label>Couple with</label><select class="char-couple"><option value="">— None —</option></select></div>
    </div>
    <div><label>Description</label><textarea class="char-desc" placeholder="How they speak, what makes them real…">${escHtml(preset.desc!==undefined?preset.desc:ARCHETYPES[0].desc)}</textarea></div>`;
  container.appendChild(card);
  card.querySelector('.char-name-input').oninput=()=>renumberCards();
  if(!preset.name) card.querySelector('.char-name-input').focus();
  renumberCards();
}

function removeCharacter(id){
  const card=document.querySelector(`.char-card[data-id="${id}"]`);if(card)card.remove();renumberCards();
}

function renumberCards(){
  const cards=document.querySelectorAll('.char-card');
  const names=Array.from(cards).map(c=>c.querySelector('.char-name-input').value.trim());
  cards.forEach((card,i)=>{
    card.querySelector('.char-num').textContent=`Character ${i+1}`;
    card.querySelector('.char-dot').style.background=`var(${AI_COLORS[i%AI_COLORS.length]})`;
    const coupleEl=card.querySelector('.char-couple');
    const cur=coupleEl.value;
    coupleEl.innerHTML='<option value="">— None —</option>';
    names.forEach((n,j)=>{if(j!==i&&n)coupleEl.innerHTML+=`<option value="${n}" ${cur===n?'selected':''}>${n}</option>`;});
  });
}

function onArchetypeChange(sel,id){
  const card=document.querySelector(`.char-card[data-id="${id}"]`);
  const idx=parseInt(sel.value);
  const d=card.querySelector('.char-desc');
  d.value=idx<ARCHETYPES.length-1?ARCHETYPES[idx].desc:'';
  if(idx===ARCHETYPES.length-1)d.focus();
}

window.addCharacter=addCharacter;window.removeCharacter=removeCharacter;window.onArchetypeChange=onArchetypeChange;

// ── NAVIGATION ──
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('chat-screen').style.display='none';
  document.getElementById('chat-screen').classList.remove('active');
}
window.showScreen=showScreen;

// Override lobby button to use proper function
document.querySelector('[onclick="showScreen(\'screen-create-room\')"]').onclick=showCreateRoom;

function escHtml(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');}
</script>
</body>
